[package]
name = "agent-mail-tray"
version = "0.1.0"
description = "agent-mail tray: loopback dashboard, mailer status and the dispatch kill switch"
edition.workspace = true
publish.workspace = true

[lib]
name = "agent_mail_tray"
path = "src/lib.rs"

[[bin]]
name = "agent-mail-tray"
path = "src/main.rs"

[dependencies]
bytes = "1"
clap = { version = "4", features = ["derive"] }
http-body-util = "0.1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
mail-core = { path = "../mail-core" }
# Keeps policy.json's key order when the kill switch rewrites it.
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "time", "signal"] }

[target.'cfg(windows)'.dependencies]
png = "0.17"
tray-icon = "=0.26.1"
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Threading", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell"] }

[dev-dependencies]
reqwest = { version = "0.12", default-features = false }
tempfile = "3"
