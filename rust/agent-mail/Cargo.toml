[package]
name = "agent-mail"
version = "0.1.0"
description = "agent-mail CLI: queues mail for the mailer, reads the inbox, pins peers, migrates the TS store"
edition.workspace = true
publish.workspace = true

[lib]
name = "agent_mail"
path = "src/lib.rs"

[[bin]]
name = "agent-mail"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
hex = "0.4"
mail-core = { path = "../mail-core" }
regex = "1"
rmcp = { version = "=3.11.0", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }

[dev-dependencies]
agent-maild = { path = "../agent-maild" }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "process", "io-util"] }
