[package]
name = "mail-core"
version = "0.1.0"
description = "agent-mail wire format, identity and crypto, byte-compatible with the TypeScript peer"
edition.workspace = true
publish.workspace = true

[dependencies]
aes-gcm = "0.10"
base64 = "0.22"
ed25519-dalek = "2.1"
hex = "0.4"
hkdf = "0.12"
pem-rfc7468 = { version = "0.7", features = ["alloc"] }
pkcs8 = "0.10"
rand_core = { version = "0.6", features = ["getrandom"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "1"
x25519-dalek = { version = "2.0", features = ["static_secrets"] }
